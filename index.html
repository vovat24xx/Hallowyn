<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Солодких снів, мій зайчик 🌙</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: radial-gradient(ellipse at bottom, #1b0b2e 0%, #0a0612 70%);
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
    position: relative;
  }

  /* Місяць */
  .moon {
    position: absolute;
    top: 30px;
    right: 40px;
    font-size: 80px;
    filter: drop-shadow(0 0 25px #ffeaa7);
    animation: moonGlow 4s ease-in-out infinite;
  }

  @keyframes moonGlow {
    0%, 100% { filter: drop-shadow(0 0 20px #ffeaa7); }
    50% { filter: drop-shadow(0 0 40px #fdcb6e); }
  }

  /* Падаючі цукерки / гарбузи / кажани */
  .falling {
    position: absolute;
    top: -60px;
    font-size: 26px;
    animation: fall linear infinite;
    pointer-events: none;
    z-index: 5;
  }

  @keyframes fall {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translateY(110vh) rotate(720deg);
      opacity: 0.2;
    }
  }

  /* Привиди */
  .ghost {
    position: absolute;
    font-size: 44px;
    opacity: 0.75;
    animation: floatGhost 7s ease-in-out infinite;
    z-index: 4;
  }

  @keyframes floatGhost {
    0%, 100% { transform: translateY(0) translateX(0) scale(1); }
    30% { transform: translateY(-30px) translateX(20px) scale(1.05); }
    60% { transform: translateY(-15px) translateX(-25px) scale(0.95); }
  }

  /* Чорна кішка */
  .cat {
    position: absolute;
    bottom: 16%;
    left: -140px;
    font-size: 52px;
    z-index: 12;
    animation: runCat 4.2s linear forwards;
    white-space: nowrap;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
  }

  @keyframes runCat {
    0% { left: -140px; transform: scaleX(1); }
    100% { left: 115%; transform: scaleX(1); }
  }

  /* Іскорки */
  .sparkle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #ffeaa7;
    border-radius: 50%;
    box-shadow: 0 0 10px #fdcb6e;
    animation: sparkle 2s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes sparkle {
    0%, 100% { opacity: 0; transform: scale(0); }
    50% { opacity: 1; transform: scale(1.4); }
  }

  /* Кнопка-цукерка */
  #candyBtn {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(145deg, #ff6b6b, #e17055, #fd79a8);
    border: 5px solid #fff;
    border-radius: 60px;
    padding: 24px 50px;
    font-size: 28px;
    font-weight: 700;
    color: white;
    cursor: pointer;
    box-shadow: 0 0 40px rgba(255, 107, 107, 0.7),
                0 12px 30px rgba(0,0,0,0.5);
    z-index: 30;
    animation: candyPulse 1.4s infinite;
    text-shadow: 0 2px 6px rgba(0,0,0,0.4);
    letter-spacing: 1px;
  }

  #candyBtn:hover {
    transform: translate(-50%, -50%) scale(1.1);
    box-shadow: 0 0 60px rgba(255, 180, 50, 0.9);
  }

  @keyframes candyPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.06); }
  }

  /* Повідомлення */
  #message {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(160deg, rgba(40, 15, 60, 0.95), rgba(20, 8, 35, 0.97));
    border: 3px solid #fdcb6e;
    border-radius: 28px;
    padding: 40px 36px;
    max-width: 92%;
    width: 440px;
    text-align: center;
    z-index: 40;
    box-shadow: 0 0 50px rgba(253, 203, 110, 0.45),
                0 20px 40px rgba(0,0,0,0.5);
    animation: msgAppear 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes msgAppear {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.6) rotate(-3deg); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
  }

  #message h2 {
    color: #fdcb6e;
    font-size: 26px;
    margin-bottom: 16px;
    text-shadow: 0 0 15px rgba(253, 203, 110, 0.5);
  }

  #message .name {
    color: #ff9ff3;
    font-size: 22px;
    font-weight: 600;
    margin: 8px 0 18px;
  }

  #message p {
    font-size: 17px;
    line-height: 1.6;
    margin-bottom: 10px;
    color: #f8f1ff;
  }

  .hearts {
    font-size: 34px;
    margin-top: 18px;
    animation: heartBeat 1.5s ease-in-out infinite;
  }

  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  /* Маленькі сердечка, що з’являються після кліку */
  .floating-heart {
    position: absolute;
    font-size: 22px;
    animation: floatUp 3s ease-out forwards;
    pointer-events: none;
    z-index: 50;
  }

  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-120px) scale(1.4); }
  }
</style>
</head>
<body>

  <div class="moon">🌕</div>

  <!-- Привиди -->
  <div class="ghost" style="top: 12%; left: 8%;">👻</div>
  <div class="ghost" style="top: 22%; left: 78%; animation-delay: 1.8s;">👻</div>
  <div class="ghost" style="top: 58%; left: 15%; animation-delay: 3.2s;">👻</div>
  <div class="ghost" style="top: 38%; left: 65%; animation-delay: 0.9s;">👻</div>

  <!-- Кішка з капелюхом -->
  <div class="cat">🎩🐈‍⬛</div>

  <!-- Кнопка -->
  <button id="candyBtn">🍬 Натисни🍬</button>

  <!-- Повідомлення -->
  <div id="message">
    <h2>🎃 Вітаю з Гелловіном! 🎃</h2>
    <div class="name">мій зайчик </div>
    <p>ти сьогодні виглядала<br>на всі <b>100%</b> ✨</p>
    <p>Сильно-сильно тебе обнімаю 🤗</p>
    <p>Солодких снів, моя хороша…</p>
    <p>Нехай тобі насниться<br>щось дуже добре і тепле 🌙</p>
    <div class="hearts">💋😘💜🐰☀️</div>
  </div>

<script>
  const items = ['🍬', '🍭', '🍫', '🎃', '🦇', '👻', '🍬', '🍭', '🍬', '🎃'];

  function createFalling() {
    const el = document.createElement('div');
    el.className = 'falling';
    el.textContent = items[Math.floor(Math.random() * items.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDuration = (3.5 + Math.random() * 4) + 's';
    el.style.fontSize = (18 + Math.random() * 22) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 9000);
  }

  // Сиплемо цукерки
  const fallInterval = setInterval(createFalling, 220);
  for (let i = 0; i < 15; i++) setTimeout(createFalling, i * 120);

  // Іскорки
  function createSparkle() {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDelay = Math.random() * 2 + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 2500);
  }
  setInterval(createSparkle, 400);

  // Через 4 секунди — кнопка
  setTimeout(() => {
    document.getElementById('candyBtn').style.display = 'block';
  }, 4000);

  // Клік по кнопці
  document.getElementById('candyBtn').addEventListener('click', function() {
    this.style.display = 'none';
    document.getElementById('message').style.display = 'block';

    // Летить купа сердечок
    for (let i = 0; i < 18; i++) {
      setTimeout(() => {
        const h = document.createElement('div');
        h.className = 'floating-heart';
        h.textContent = ['💗', '💖', '💕', '✨', '💋'][Math.floor(Math.random() * 5)];
        h.style.left = (30 + Math.random() * 40) + 'vw';
        h.style.top = (45 + Math.random() * 20) + 'vh';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 3000);
      }, i * 80);
    }
  });
</script>
</body>
</html>
